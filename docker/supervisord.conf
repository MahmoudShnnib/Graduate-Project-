[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0

[program:php-fpm]
command=php-fpm
autostart=true
autorestart=true
; Graceful shutdown: SIGQUIT lets FPM finish in-flight requests before exiting.
; stopwaitsecs > nginx fastcgi_read_timeout (120) so a long PDF render isn't killed mid-flight.
stopsignal=QUIT
stopwaitsecs=130
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g 'daemon off;'
autostart=true
autorestart=true
; SIGQUIT = nginx graceful shutdown (drain connections, then exit).
stopsignal=QUIT
stopwaitsecs=130
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
