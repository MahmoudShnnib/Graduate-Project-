; Production PHP-FPM pool overrides — copied to /usr/local/etc/php-fpm.d/zz-www.conf
; so it loads after the stock www.conf and wins. The alpine default caps the pool at
; pm.max_children = 5; a single slow mPDF transcript render would then starve every
; other request. These values suit a small VM (≈1-2 vCPU, ≈1GB) for one faculty.
[www]
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

; request_terminate_timeout stays at the default (0/off) on purpose — php.ini's
; max_execution_time = 120 governs long PDF renders. See docker/php.ini.

; Surface FPM worker logs through the container's stdout/stderr (supervisord pipes them).
catch_workers_output = yes
decorate_workers_output = no
