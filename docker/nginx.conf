user www-data;
worker_processes auto;
pid /run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    # Traefik / Cloudflare terminate TLS in front of this container. Forward the
    # original scheme to PHP so Laravel marks requests secure, sets session cookies
    # correctly, and generates https:// URLs. Without this, login succeeds but the
    # session cookie is lost on the next request → endless /admin/login refresh.
    map $http_x_forwarded_proto $fastcgi_https {
        default '';
        https   on;
    }

    # Arabic UTF-8 HTML/JSON compresses ~3-4x — large TTFB win on RTL pages.
    # Static js/css/svg are still served compressed; images/fonts are already compressed.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/ttf
        font/otf;

    server {
        listen 8080;
        root /var/www/public;
        index index.php;

        # Allow large file uploads (bachelor certificate uploads)
        client_max_body_size 20M;

        # Security headers. HSTS is intentionally omitted here — enable it only once
        # TLS terminates in front of this container, otherwise it can lock out plain-HTTP
        # health checks during the first deploy. Add behind the proxy:
        #   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "0" always;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Livewire JS + /update are Laravel routes, not files under public/.
        # Must come before the static *.js regex or nginx returns 404 (Filament #11107).
        location ^~ /livewire- {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
            fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
            fastcgi_param HTTP_X_FORWARDED_HOST $http_x_forwarded_host;
            fastcgi_param HTTPS $fastcgi_https;
            # Extra time for PDF generation
            fastcgi_read_timeout 120;
            # Gzip breaks Livewire update responses behind some proxies (Filament #11107).
            gzip off;
        }

        # Static files that exist under public/ only (Filament vendor assets, Vite build, etc.)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
