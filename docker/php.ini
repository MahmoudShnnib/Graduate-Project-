; Production PHP overrides — loaded last (zz- prefix) over php.ini-production defaults.
; nginx allows 20M bodies (client_max_body_size); PHP must match or the bachelor-
; certificate upload on /apply fails silently at the 2M default.
upload_max_filesize = 20M
post_max_size = 21M

; mPDF transcript/clearance generation needs headroom over the 128M default.
memory_limit = 256M

; Align with nginx fastcgi_read_timeout (120) so PHP doesn't kill long PDF renders
; at the 30s default before nginx would. NOTE: PHP-FPM request_terminate_timeout
; (pool www.conf, default 0/off) can override this — keep it disabled.
max_execution_time = 120

; OPcache — the extension is installed in the Dockerfile but unconfigured by default,
; which leaves validate_timestamps=1 (PHP stat()s every source file on every request).
; In an immutable container the code never changes between deploys, so disable timestamp
; validation entirely and give the cache enough room for Laravel + Filament's file count.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
