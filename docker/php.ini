; Production PHP overrides — loaded last (zz- prefix) over php.ini-production defaults.
; nginx allows 20M bodies (client_max_body_size); PHP must match or the bachelor-
; certificate upload on /apply fails silently at the 2M default.
upload_max_filesize = 20M
post_max_size = 21M

; mPDF transcript/clearance generation needs headroom over the 128M default.
memory_limit = 256M

; Align with nginx fastcgi_read_timeout (120) so PHP doesn't kill long PDF renders
; at the 30s default before nginx would. NOTE: PHP-FPM request_terminate_timeout
; (pool www.conf, default 0/off) can override this — keep it disabled.
max_execution_time = 120
