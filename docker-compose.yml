# Graduate Project — production Docker Compose stack
#
# Quick start (local):
#   1. cp .env.example .env
#   2. Set APP_KEY, APP_URL, POSTGRES_PASSWORD, mail + Qonvo credentials.
#   3. APP_PORT=8080 docker compose up -d --build   # optional host bind
#   4. Open http://localhost:8080/up then /apply
#
# Dokploy: leave APP_PORT unset — no host port is published (avoids 8080 clashes
# with other stacks). In the Dokploy app settings, point the domain at container
# port 8080 on service "app". The reverse proxy reaches it over the compose network.
#
# Uploads persist in app_uploads; Postgres data in postgres_data.

name: graduate-project

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-graduate_project}
      DB_USERNAME: ${POSTGRES_USER:-graduate}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      # C1 from deployment checklist — survive container rebuilds / redeploys
      - app_uploads:/var/www/storage/app/public
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-graduate_project}
      POSTGRES_USER: ${POSTGRES_USER:-graduate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  app_uploads:
  postgres_data:
