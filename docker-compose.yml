# Graduate Project — production Docker Compose stack
#
# Quick start:
#   1. cp .env.example .env
#   2. Set APP_KEY (php artisan key:generate --show), APP_URL, POSTGRES_PASSWORD,
#      mail + Qonvo credentials. Keep DB_CONNECTION unset — compose overrides it.
#   3. docker compose up -d --build
#   4. Open http://localhost:8080/up (health) then /apply
#
# Uploads (bachelor certificates, thesis proposals, PDFs) persist in the app_uploads
# volume. Postgres data persists in postgres_data.

name: graduate-project

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-graduate_project}
      DB_USERNAME: ${POSTGRES_USER:-graduate}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      # C1 from deployment checklist — survive container rebuilds / redeploys
      - app_uploads:/var/www/storage/app/public
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-graduate_project}
      POSTGRES_USER: ${POSTGRES_USER:-graduate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  app_uploads:
  postgres_data:
