# Full local/production stack for the graduate-studies system.
#
#   1. Copy .env.example to .env and set APP_KEY (php artisan key:generate) +
#      a strong DB_PASSWORD. Set APP_URL to the host/port you expose below.
#   2. docker compose up -d --build
#
# The app image's entrypoint runs migrations + idempotent seeders on every boot
# (see docker/entrypoint.sh), so the database is provisioned automatically once
# Postgres is healthy. Uploaded documents persist in the `app_storage` volume.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pgsms-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      APP_NAME: ${APP_NAME:-PGSMS}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:?APP_KEY is required — run "php artisan key:generate --show"}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_TIMEZONE: ${APP_TIMEZONE:-Africa/Tripoli}
      # Logging — .env is excluded from the image (.dockerignore), so without these the
      # app falls back to config defaults (stack -> single file only) which writes to an
      # ephemeral, often-unwritable storage/logs/laravel.log that nobody can see. Routing
      # to stderr surfaces every error in `docker compose logs app` — the 12-factor way.
      # Keep LOG_LEVEL=debug while diagnosing the /apply 500, then raise it to "warning".
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      # The Dockerfile ships pdo_pgsql; point the app at the db service below.
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-pgsms}
      DB_USERNAME: ${DB_USERNAME:-pgsms}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      # database-backed session/queue/cache (matches .env.example defaults)
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      # Mail — also absent from the image (.env is ignored). Without these the mailer
      # defaults to "log"; the /apply confirmation notification is wrapped in try/catch
      # so a misconfigured mailer can't 500 the form, but real delivery needs these set.
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_SCHEME: ${MAIL_SCHEME:-}
      MAIL_HOST: ${MAIL_HOST:-127.0.0.1}
      MAIL_PORT: ${MAIL_PORT:-2525}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@example.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-${APP_NAME:-PGSMS}}
      # WhatsApp (Qonvo) — leave blank to disable the channel
      QONVO_API_TOKEN: ${QONVO_API_TOKEN:-}
      QONVO_SENDER_PHONE: ${QONVO_SENDER_PHONE:-}
      QONVO_WEBHOOK_SECRET: ${QONVO_WEBHOOK_SECRET:-}
    volumes:
      # Persist uploaded documents (storage/app/public/applications) across rebuilds.
      - app_storage:/var/www/storage/app

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-pgsms}
      POSTGRES_USER: ${DB_USERNAME:-pgsms}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-pgsms} -d ${DB_DATABASE:-pgsms}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
  app_storage:
